<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Premium Oyun Kitabxanası - Steam Edition</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>

    <div id="vignette"></div>
    <div id="category-hud">Kitabxana</div>

    <div id="steam-login-box">
        <input type="text" id="steam-id-input" placeholder="Steam ID və ya Profil Linki">
        <button id="steam-load-btn">YÜKLƏ</button>
    </div>

    <div id="room-nav">
        <button onclick="rotateRoom('left')">◀ Tövsiyələr</button>
        <button onclick="rotateRoom('front')">Əsas Kitabxana</button>
        <button onclick="rotateRoom('right')">Seçilmişlər ▶</button>
    </div>

    <button class="nav-arrow" id="arrow-left">◀</button>
    <button class="nav-arrow" id="arrow-right">▶</button>

    <div id="info-panel">
        <img id="panel-banner" src="" alt="Game Banner">
        <div class="panel-content">
            <h1 id="game-title">Oyun Adı</h1>
            <div class="meta-tags" id="game-tags"></div>
            <p id="game-desc">Oyun barədə ətraflı məlumatlar yüklənir...</p>
            <button id="add-fav-btn">★ Seçilmişlərə Əlavə Et</button>
            <button id="close-btn">Rəfə Qayıt</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="/app.js"></script>
</body>
</html>
